###############################################################################
#  Andes Shaders · Minecraft 1.21.11 · Iris 1.10+ (Fabric / NeoForge / Quilt)
#  ---------------------------------------------------------------------------
#  OJO: las opciones del pack (EXPOSURE, SATURATION, SHADOWS, BLOOM, ...) NO se
#  declaran aqui. Iris/OptiFine solo leen las opciones de los archivos de
#  shader, asi que estan en "shaders/lib/settings.glsl" (cada "#define" con su
#  lista de valores "[...]" es una opcion del menu "Shader Pack Settings").
#
#  Este archivo solo controla el menu (pantallas, sliders, perfiles) y los
#  ajustes del pipeline de render.
###############################################################################

#================================ PERFILES ====================================
# Un perfil aplica varios valores de opciones a la vez.  "!OPCION" desactiva
# una opcion booleana y "OPCION:valor" asigna un valor.
profile.PATATA = !SHADOWS !BLOOM !FXAA !WATER_WAVES !WAVING_PLANTS !WAVING_LEAVES !CLOUD_SHADING TONEMAP:0 VIGNETTE:0.0 SATURATION:1.0 EXPOSURE:1.0 shadowMapResolution:1024 shadowDistance:64.0
profile.RAPIDO = !SHADOWS !BLOOM !WATER_WAVES !WAVING_LEAVES TONEMAP:0 VIGNETTE:0.15 shadowMapResolution:1024 shadowDistance:64.0
profile.EQUILIBRADO = SHADOWS BLOOM FXAA WATER_WAVES WAVING_PLANTS WAVING_LEAVES CLOUD_SHADING BLOCKLIGHT_TINT UNDERWATER_TINT VIGNETTE:0.3 TONEMAP:1 shadowMapResolution:2048 shadowDistance:128.0
profile.ALTO = SHADOWS BLOOM FXAA WATER_WAVES WAVING_PLANTS WAVING_LEAVES CLOUD_SHADING BLOCKLIGHT_TINT UNDERWATER_TINT VIGNETTE:0.3 TONEMAP:1 shadowMapResolution:3072 shadowDistance:160.0
profile.ULTRA = SHADOWS BLOOM FXAA WATER_WAVES WAVING_PLANTS WAVING_LEAVES CLOUD_SHADING BLOCKLIGHT_TINT UNDERWATER_TINT VIGNETTE:0.3 TONEMAP:2 BLOOM_STRENGTH:0.75 shadowMapResolution:4096 shadowDistance:192.0

#============================= MENU DE OPCIONES ===============================
screen = <profile> [CIELO] [LUCES] [SOMBRAS] [AGUA] [VIENTO] [POST]
screen.columns = 2

screen.CIELO = CUSTOM_SKY SUN_GLOW STARS HORIZON_FOG CLOUD_SHADING
screen.LUCES = NIGHT_BRIGHTNESS BLOCKLIGHT_TINT
screen.SOMBRAS = SHADOWS SHADOW_SOFTNESS SHADOW_COLOR shadowMapResolution shadowDistance
screen.AGUA = WATER_WAVES WATER_WAVE_HEIGHT WATER_REFLECTIVITY UNDERWATER_TINT
screen.VIENTO = WAVING_PLANTS WAVING_LEAVES WAVE_STRENGTH WIND_SPEED
screen.POST = BLOOM BLOOM_STRENGTH TONEMAP EXPOSURE SATURATION CONTRAST VIGNETTE FXAA

sliders = SUN_GLOW STARS HORIZON_FOG SHADOW_SOFTNESS SHADOW_COLOR NIGHT_BRIGHTNESS WATER_WAVE_HEIGHT WATER_REFLECTIVITY WAVE_STRENGTH WIND_SPEED BLOOM_STRENGTH EXPOSURE SATURATION CONTRAST VIGNETTE shadowMapResolution shadowDistance

#============================ AJUSTES DEL PIPELINE ============================
# El pack dibuja su propia vineta y su propio tinte bajo el agua
vignette = false
underwaterOverlay = false

# Sombras: terreno, entidades y bloques; el agua y el cristal no proyectan sombra
shadowTerrain = true
shadowTranslucent = false
shadowEntities = true
shadowBlockEntities = true

#======================== DESACTIVACION DE PROGRAMAS ==========================
# Si las sombras estan apagadas el pase de sombras ni se ejecuta,
# y el bloom solo se calcula cuando esta activado.
# (Estas condiciones se evaluan con las opciones declaradas en el GLSL.)
program.shadow.enabled = SHADOWS
program.composite.enabled = BLOOM
program.composite1.enabled = BLOOM
